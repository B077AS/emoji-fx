name: GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already published on Maven Central (e.g. 1.0.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download jars from Maven Central
        run: |
          base="https://repo1.maven.org/maven2/io/github/b077as/emojifx/emoji/${{ inputs.version }}"
          for f in "" "-sources" "-javadoc"; do
            curl -fsSLO "$base/emoji-${{ inputs.version }}$f.jar"
          done

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ inputs.version }}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" *.jar --clobber
